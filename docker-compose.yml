services:
  nowen-video:
    image: ghcr.io/grimm-yh/nowen-video:fix-emby-compat
    container_name: nowen-video
    ports:
      - "8080:8080"
      - "7359:7359/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
      - ./cache:/cache
      - /volume1/Media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
