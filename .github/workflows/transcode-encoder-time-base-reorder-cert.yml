name: Transcode Encoder Time-Base Reorder Certification

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/transcode-encoder-time-base-reorder-cert/**'
      - 'internal/service/ffmpeg/**'
      - 'internal/transcode/attestation/**'
      - 'internal/transcode/avsync/**'
      - 'internal/transcode/boundaryevidence/**'
      - 'internal/transcode/certification/boundary_*.go'
      - 'internal/transcode/certification/encoder_time_base_*.go'
      - 'internal/transcode/certification/reorder_cadence_*.go'
      - 'internal/transcode/certification/reorder_perceptual_*.go'
      - 'internal/transcode/certification/source_origin_cadence_*.go'
      - 'internal/transcode/outputcadence/**'
      - 'internal/transcode/reordercandidate/**'
      - 'internal/transcode/timebasecandidate/**'
      - 'internal/transcode/timestampplan/**'
      - '.github/scripts/verify_encoder_time_base_reorder.py'
      - '.github/scripts/verify_encoder_time_base_reorder_exact.py'
      - '.github/workflows/transcode-encoder-time-base-reorder-cert.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: transcode-encoder-time-base-reorder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reorder-certification:
    name: Certify B-frame DTS reorder and A/V boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending certification status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"B-frame reorder certification is running\",\"context\":\"transcode/encoder-time-base-reorder\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify reorder contracts
        run: |
          go test ./internal/transcode/reordercandidate
          go test ./internal/transcode/timebasecandidate ./internal/transcode/outputcadence
          go test ./internal/transcode/certification
      - name: Build certification command
        run: go build -trimpath -o /tmp/nowen-transcode-encoder-time-base-reorder-cert ./cmd/transcode-encoder-time-base-reorder-cert
      - name: Produce B-frame reorder matrix
        run: |
          mkdir -p /tmp/nowen-transcode-encoder-time-base-reorder
          /tmp/nowen-transcode-encoder-time-base-reorder-cert \
            -output /tmp/nowen-transcode-encoder-time-base-reorder/encoder-time-base-reorder-matrix-v1.json
      - name: Verify strict DTS, reorder variance, cadence, perceptual frames and A/V policy
        run: |
          python3 .github/scripts/verify_encoder_time_base_reorder.py \
            /tmp/nowen-transcode-encoder-time-base-reorder/encoder-time-base-reorder-matrix-v1.json
      - name: Verify FFmpeg 6.1.1 exact semantic baseline
        run: |
          python3 .github/scripts/verify_encoder_time_base_reorder_exact.py \
            /tmp/nowen-transcode-encoder-time-base-reorder/encoder-time-base-reorder-matrix-v1.json
      - name: Upload encoder time-base reorder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcode-encoder-time-base-reorder-${{ github.sha }}
          path: /tmp/nowen-transcode-encoder-time-base-reorder/encoder-time-base-reorder-matrix-v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish final certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE="success"
            DESCRIPTION="B-frame reorder certification passed"
          else
            STATE="failure"
            DESCRIPTION="B-frame reorder certification failed"
          fi
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${STATE}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"${DESCRIPTION}\",\"context\":\"transcode/encoder-time-base-reorder\"}"
