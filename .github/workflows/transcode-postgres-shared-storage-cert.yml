name: Transcode PostgreSQL Shared Storage Certification

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - '.github/scripts/certify_postgres_shared_storage.sh'
      - '.github/workflows/transcode-postgres-shared-storage-cert.yml'
      - 'docs/TRANSCODE_POSTGRES_SHARED_STORAGE.md'
      - 'internal/model/transcode_*.go'
      - 'internal/repository/repo_transcode_*.go'
      - 'internal/service/transcode_*.go'
  pull_request:
    paths:
      - '.github/scripts/certify_postgres_shared_storage.sh'
      - '.github/workflows/transcode-postgres-shared-storage-cert.yml'
      - 'docs/TRANSCODE_POSTGRES_SHARED_STORAGE.md'
      - 'internal/model/transcode_*.go'
      - 'internal/repository/repo_transcode_*.go'
      - 'internal/service/transcode_*.go'

permissions:
  contents: read

concurrency:
  group: transcode-postgres-shared-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Two instances, one PostgreSQL ledger and shared store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen
          POSTGRES_DB: nowen_cluster_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_cluster_cert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://nowen:nowen@127.0.0.1:5432/nowen_cluster_cert?sslmode=disable
      SHARED_ROOT: ${{ github.workspace }}/.cert/shared-artifact-store
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run PostgreSQL and shared-storage contention certification
        run: bash .github/scripts/certify_postgres_shared_storage.sh
      - name: Verify shared store has no health or publication debris
        run: |
          test ! -e "$SHARED_ROOT/.cluster-probe.tmp"
          test ! -e "$SHARED_ROOT/.cluster-probe.ok"
          test "$(find "$SHARED_ROOT/artifacts" -type f | wc -l)" -eq 0
