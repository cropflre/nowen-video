name: One-shot legacy rollback deadline

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - scripts/enforce_legacy_rollback_deadline.py
      - .github/workflows/one-shot-legacy-rollback-deadline.yml

permissions:
  contents: write

concurrency:
  group: legacy-rollback-deadline
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply rollback deadline fence
        run: |
          python3 scripts/enforce_legacy_rollback_deadline.py
          gofmt -w \
            internal/repository/repo_transcode_artifact_cleanup.go \
            internal/service/task_center.go \
            internal/service/task_actions.go \
            internal/service/task_actions_test.go \
            internal/handler/task_center.go
          git diff --check
      - name: Verify rollback deadline contracts
        run: |
          go test ./internal/service -run 'AvailableTaskActions|RollbackLegacy|ExpiredLegacyRollback'
          go test ./internal/repository -run 'ArtifactCleanup'
          go test ./internal/handler ./cmd/server ./cmd/server-lite
          go test ./...
          go build -o /tmp/nowen-server-lite ./cmd/server-lite
          go build -o /tmp/nowen-server ./cmd/server
      - name: Verify Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified deadline fence
        run: |
          rm -f scripts/enforce_legacy_rollback_deadline.py
          rm -f .github/workflows/one-shot-legacy-rollback-deadline.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(transcode): enforce legacy rollback deadline"
          git push origin HEAD:refactor/server-lite-v1
