name: release-server
run-name: >-
  release-server
  ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.1.0' }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, e.g. 1.3.5 or 1.3.5-rc.1'
        required: true
      push_docker:
        description: 'Build and push multi-arch Docker image to GHCR (and Docker Hub if configured)'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Build Web & Server binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build Web frontend
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          npm ci
          npm run build

      - name: Build multi-platform server archives
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist/server
          LDFLAGS="-s -w -X github.com/nowen-video/nowen-video/internal/version.Version=${VERSION}"

          build_target() {
            local os="$1"
            local arch="$2"
            local ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            local stage="dist/stage-${os}-${arch}"
            mkdir -p "${stage}/web"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "${stage}/nowen-video${ext}" ./cmd/server-lite
            cp -R web/dist "${stage}/web/dist"
            cp config.example.yaml "${stage}/config.example.yaml"
            cp LICENSE "${stage}/LICENSE"
            if [ "$os" = "windows" ]; then
              (cd "${stage}" && zip -rq "../server/nowen-video-${VERSION}-${os}-${arch}.zip" .)
            else
              tar -C "${stage}" -czf "dist/server/nowen-video-${VERSION}-${os}-${arch}.tar.gz" .
            fi
            rm -rf "${stage}"
          }

          build_target linux amd64
          build_target linux arm64
          build_target darwin arm64
          build_target windows amd64

          (cd dist/server && sha256sum ./* > SHA256SUMS.txt)
          ls -lh dist/server

      - name: Build universal fnOS package (.fpk)
        env:
          FPK_VERSION: ${{ steps.meta.outputs.version }}
          FPK_IMAGE_TAG: ${{ steps.meta.outputs.version }}
          FPK_OUT_DIR: dist/fpk
          REPOSITORY: ${{ github.repository }}
        run: |
          DOCKERHUB_REPO="ghcr.io/${REPOSITORY,,}" node scripts/fpk/build-fpk.mjs
          (cd "$FPK_OUT_DIR" && sha256sum -c SHA256SUMS-fpk.txt)

      - name: Upload fnOS package
        uses: actions/upload-artifact@v4
        with:
          name: nowen-video-fnos-release
          path: dist/fpk/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload server archives
        uses: actions/upload-artifact@v4
        with:
          name: nowen-video-server-release
          path: dist/server/*
          if-no-files-found: error
          retention-days: 14

  build-docker:
    name: Build & Push Docker (linux/amd64, linux/arm64)
    needs: build-binaries
    if: github.event_name == 'push' || inputs.push_docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub (optional)
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          VERSION="${{ needs.build-binaries.outputs.version }}"
          REPO_LOWER="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAGS="ghcr.io/${REPO_LOWER}:${VERSION},ghcr.io/${REPO_LOWER}:v${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}:latest"
          fi
          if [ "${{ steps.dockerhub.outputs.enabled }}" = "true" ]; then
            DH_REPO="${DOCKERHUB_USERNAME}/nowen-video"
            TAGS="${TAGS},${DH_REPO}:${VERSION},${DH_REPO}:v${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS},${DH_REPO}:latest"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            NOWEN_VERSION=${{ needs.build-binaries.outputs.version }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify fnOS image supports both architectures
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build-binaries.outputs.version }}
        run: |
          set -o pipefail
          docker buildx imagetools inspect --raw "ghcr.io/${REPOSITORY,,}:${VERSION}" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] |
              contains(["amd64", "arm64"])'

  release:
    name: Attach Server and fnOS packages to Draft Release
    needs: [build-binaries, build-docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nowen-video-server-release
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: nowen-video-fnos-release
          path: fnos

      - name: Ensure Draft Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.build-binaries.outputs.tag }}"
          VERSION="${{ needs.build-binaries.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Nowen Video ${VERSION}" --notes "Automated release ${TAG}" || true
          fi

      - name: Attach artifacts to GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(needs.build-binaries.outputs.version, '-') }}
          generate_release_notes: true
          name: Nowen Video ${{ needs.build-binaries.outputs.version }}
          files: artifacts/*
          fail_on_unmatched_files: true

      - name: Attach fnOS package with Chinese release label
        working-directory: fnos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-binaries.outputs.tag }}
          VERSION: ${{ needs.build-binaries.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-fpk.txt
          # GitHub may normalize non-ASCII asset filenames. Keep a stable download URL.
          PACKAGE="nowen-video-${VERSION}.fpk"
          LABEL="弄文影视-${VERSION}.fpk"
          mv "$LABEL" "$PACKAGE"
          sha256sum "$PACKAGE" > SHA256SUMS-fpk.txt
          gh release upload "$TAG" "${PACKAGE}#${LABEL}" SHA256SUMS-fpk.txt --clobber
