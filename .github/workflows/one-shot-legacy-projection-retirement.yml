name: One-shot legacy projection retirement

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - scripts/implement_legacy_projection_retirement.py
      - scripts/fix_legacy_projection_retirement_script.py
      - .github/workflows/one-shot-legacy-projection-retirement.yml
      - .github/workflows/one-shot-transcode-projection-audit.yml

permissions:
  contents: write

concurrency:
  group: legacy-projection-retirement
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply projection retirement
        run: |
          python3 scripts/fix_legacy_projection_retirement_script.py
          python3 scripts/implement_legacy_projection_retirement.py
          gofmt -w \
            internal/model/transcode_execution.go \
            internal/model/model.go \
            internal/model/migrate_lite.go \
            internal/model/legacy_transcode_projection_migration_test.go \
            internal/repository/repo_stats.go \
            internal/repository/repo_transcode_queue.go \
            internal/repository/repo_transcode_artifact_cleanup.go \
            internal/repository/runtime_history.go \
            internal/service/artifact_maintenance.go \
            internal/service/transcode_cleanup.go \
            internal/service/transcode_cleanup_state.go \
            internal/service/transcode_cleanup_admin.go \
            internal/service/legacy_transcode_projection_migration.go \
            internal/service/legacy_transcode_projection_migration_test.go \
            internal/service/task_center.go \
            internal/service/task_actions.go \
            internal/service/task_actions_test.go \
            internal/service/task_center_test.go \
            internal/service/transcode_runtime_retirement.go \
            internal/service/transcode_runtime_retirement_test.go \
            internal/service/runtime_history.go \
            internal/handler/admin_system.go \
            cmd/server-lite/router.go \
            cmd/server/legacy_projection_retired_test.go
          git diff --check
      - name: Verify focused contracts
        run: |
          go test ./internal/model -run 'TestFreshProfilesDoNotCreateLegacyTranscodeTasks|TestExistingLegacyTranscodeTasksSurviveProfileMigration'
          go test ./internal/repository -run 'ArtifactCleanup|RuntimeHistory'
          go test ./internal/service -run 'LegacyProjection|ArtifactCleanup|RuntimeRetirement|TaskAction|TaskCenter|RuntimeHistory'
          go test ./cmd/server ./cmd/server-lite
      - name: Verify all backend packages and binaries
        run: |
          go test ./...
          go build -o /tmp/nowen-server-lite ./cmd/server-lite
          go build -o /tmp/nowen-server ./cmd/server
          ! grep -R -E 'NewTaskCenterServiceWithoutRuntimeTranscode|NewTaskActionDispatcherWithoutRuntimeTranscode|LoadJobPayload' internal cmd --include='*.go'
          ! grep -R -E '&TranscodeTask\{\}' internal/model/model.go internal/model/migrate_lite.go
          grep -F 'CompleteArtifactCleanupByClaim' internal/repository/repo_transcode_artifact_cleanup.go
          grep -F 'RollbackLegacyArtifactCleanup' internal/repository/repo_transcode_artifact_cleanup.go
      - name: Verify Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified phase and remove one-shot files
        run: |
          rm -f scripts/implement_legacy_projection_retirement.py
          rm -f scripts/fix_legacy_projection_retirement_script.py
          rm -f .github/workflows/one-shot-legacy-projection-retirement.yml
          rm -f .github/workflows/one-shot-transcode-projection-audit.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(transcode): retire legacy task projection"
          git push origin HEAD:refactor/server-lite-v1
