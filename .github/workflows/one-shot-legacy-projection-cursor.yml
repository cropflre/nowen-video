name: One-shot legacy projection cursor

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - scripts/implement_legacy_projection_cursor.py
      - scripts/fix_legacy_projection_cursor_script.py
      - .github/workflows/one-shot-legacy-projection-cursor.yml

permissions:
  contents: write

concurrency:
  group: legacy-projection-cursor
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply durable cursor phase
        run: |
          python3 scripts/fix_legacy_projection_cursor_script.py
          python3 scripts/implement_legacy_projection_cursor.py
          gofmt -w \
            internal/model/transcode_execution.go \
            internal/model/legacy_transcode_projection_state_test.go \
            internal/repository/repo_stats.go \
            internal/repository/repo_transcode_execution.go \
            internal/repository/repo_legacy_transcode_projection_migration.go \
            internal/repository/repo_legacy_transcode_projection_migration_test.go \
            internal/repository/runtime_history.go \
            internal/service/artifact_maintenance.go \
            internal/service/legacy_transcode_projection_migration.go \
            internal/service/legacy_transcode_projection_cursor_test.go \
            internal/service/transcode_cleanup_admin.go \
            internal/service/task_center.go \
            internal/service/task_actions.go \
            internal/service/runtime_history.go \
            cmd/server/legacy_projection_cursor_test.go
          git diff --check
      - name: Verify focused cursor contracts
        run: |
          go test ./internal/model -run 'LegacyProjection|FreshProfilesDoNotCreateLegacyTranscodeTasks|ExistingLegacyTranscodeTasksSurviveProfileMigration'
          go test ./internal/repository -run 'LegacyProjection|RuntimeHistory'
          go test ./internal/service -run 'LegacyProjection|TaskAction|TaskCenter|RuntimeHistory'
          go test ./cmd/server ./cmd/server-lite
      - name: Verify complete backend and source boundaries
        run: |
          go test ./...
          go build -o /tmp/nowen-server-lite ./cmd/server-lite
          go build -o /tmp/nowen-server ./cmd/server
          ! grep -R -F 'ListLegacyTerminalWithOutput(500)' internal/service --include='*.go'
          grep -F 'legacy_transcode_projection_migrations' internal/model/transcode_execution.go
          grep -F 'ClaimLegacyProjectionMigration' internal/repository/repo_legacy_transcode_projection_migration.go
          grep -F 'CompleteLegacyProjectionMigrationBatch' internal/repository/repo_legacy_transcode_projection_migration.go
          grep -F 'SourceRetireAfter' internal/model/transcode_execution.go
      - name: Verify Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified phase and remove one-shot files
        run: |
          rm -f scripts/implement_legacy_projection_cursor.py
          rm -f scripts/fix_legacy_projection_cursor_script.py
          rm -f .github/workflows/one-shot-legacy-projection-cursor.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(transcode): add legacy migration cursor"
          git push origin HEAD:refactor/server-lite-v1
