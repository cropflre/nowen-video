name: One-shot Runtime API binary cleanup

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - .github/workflows/runtime-api-binary-cleanup.yml

permissions:
  contents: write

concurrency:
  group: runtime-api-binary-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - name: Restore tracked binaries from phase baseline
        run: |
          git checkout f58d6de55baf52df0394540740156c6a9141e385 -- server server-lite
          git diff --check
          git diff --quiet f58d6de55baf52df0394540740156c6a9141e385 -- server server-lite
      - name: Commit cleanup and remove one-shot workflow
        run: |
          rm -f .github/workflows/runtime-api-binary-cleanup.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(build): restore tracked server binaries"
          git push origin HEAD:refactor/server-lite-v1
