name: One-shot artifact maintenance refactor

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - scripts/artifact_maintenance_refactor.py
      - scripts/artifact_maintenance_refactor_fix.py
      - scripts/artifact_maintenance_refactor_fix2.py
      - .github/workflows/artifact-maintenance-refactor.yml

permissions:
  contents: write

concurrency:
  group: artifact-maintenance-refactor
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply physical runtime source removal
        run: |
          python3 scripts/artifact_maintenance_refactor.py --apply
          python3 scripts/artifact_maintenance_refactor_fix.py
          python3 scripts/artifact_maintenance_refactor_fix2.py
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
      - name: Verify architecture and binaries
        run: |
          go test ./...
          go build ./cmd/server-lite
          go build ./cmd/server
          test ! -e internal/service/transcode.go
          test ! -e internal/service/transcode_queue.go
          test ! -e internal/service/transcode_lease.go
          test ! -e internal/service/transcode_process_shutdown.go
          test ! -e internal/service/transcode_startup.go
          test ! -e internal/service/transcode_startup_continuation.go
          ! grep -R "type TranscodeService" internal cmd --include='*.go'
          ! grep -R "type TranscodeJob struct" internal cmd --include='*.go'
          ! grep -R "NewTranscodeService" internal cmd --include='*.go'
      - name: Commit verified refactor and remove one-shot files
        run: |
          rm -f scripts/artifact_maintenance_refactor.py
          rm -f scripts/artifact_maintenance_refactor_fix.py
          rm -f scripts/artifact_maintenance_refactor_fix2.py
          rm -f .github/workflows/artifact-maintenance-refactor.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(transcode): remove persistent runtime worker source"
          git push origin HEAD:refactor/server-lite-v1
