name: 临时同步 Desktop Cargo.lock

on:
  push:
    branches:
      - integration/desktop2-main-20260818
    paths:
      - '.github/workflows/cargo-lock-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/desktop2-main-20260818
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: 由 Cargo 重新生成锁文件
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml

      - name: 提交锁文件并移除临时工作流
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cargo-lock-sync-temp.yml
          git add desktop/src-tauri/Cargo.lock
          git commit -m "同步 Desktop 2.0 Cargo 锁文件"
          git push origin HEAD:integration/desktop2-main-20260818
