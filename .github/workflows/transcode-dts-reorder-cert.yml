name: Transcode DTS Reorder Certification

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - '.github/scripts/verify_dts_reorder.py'
      - '.github/scripts/test_verify_dts_reorder.py'
      - '.github/workflows/transcode-dts-reorder-cert.yml'
      - 'docs/TRANSCODE_DTS_REORDER.md'
      - 'docs/TRANSCODE_ENCODER_TIME_BASE_CANDIDATES.md'
  pull_request:
    paths:
      - '.github/scripts/verify_dts_reorder.py'
      - '.github/scripts/test_verify_dts_reorder.py'
      - '.github/workflows/transcode-dts-reorder-cert.yml'
      - 'docs/TRANSCODE_DTS_REORDER.md'
      - 'docs/TRANSCODE_ENCODER_TIME_BASE_CANDIDATES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcode-dts-reorder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dts-reorder:
    name: Certify B-frame decode and presentation ordering
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify analyzer contracts
        run: python3 .github/scripts/test_verify_dts_reorder.py
      - name: Produce DTS reorder evidence
        run: |
          mkdir -p /tmp/nowen-transcode-dts-reorder
          python3 .github/scripts/verify_dts_reorder.py \
            --output /tmp/nowen-transcode-dts-reorder/dts-reorder-evidence-v1.json
      - name: Verify evidence safety flags
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/nowen-transcode-dts-reorder/dts-reorder-evidence-v1.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['schema_version'] == 'encoder-time-base-dts-reorder-evidence-v1'
          assert report['all_cases_stable'] is True
          assert report['all_candidates_equivalent'] is True
          assert report['seamless_allowed'] is False
          assert report['discontinuity_required'] is True
          assert len(report['cases']) == 3
          PY
      - name: Upload DTS reorder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcode-dts-reorder-${{ github.sha }}
          path: /tmp/nowen-transcode-dts-reorder/dts-reorder-evidence-v1.json
          if-no-files-found: error
          retention-days: 14
