name: Android Signing Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-signing-identity.yml'
      - '.github/workflows/release-android-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signing-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ANDROID_RELEASE_TAG: v1.2.5
  LEGACY_ANDROID_APK_NAME: nowen-video-android-1.2.5.apk
  ANDROID_PRODUCTION_APPLICATION_ID: com.nowen.video
  # Prefer the official post-takeover names, while accepting the historical V2
  # secret names so existing repository configuration can be migrated safely.
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_V2_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_V2_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_V2_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_V2_KEY_PASSWORD }}

jobs:
  verify:
    name: Verify V1 signing identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify configured keystore matches historical V1 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Android signing secret: $name"
              missing=1
            fi
          done
          (( missing == 0 )) || exit 1

          store_file="$RUNNER_TEMP/nowen-video-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$store_file"
          chmod 600 "$store_file"

          keytool -list \
            -keystore "$store_file" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          keytool -exportcert \
            -keystore "$store_file" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/configured-signer.der" >/dev/null
          configured_cert="$(sha256sum "$RUNNER_TEMP/configured-signer.der" | awk '{print $1}')"
          [[ "$configured_cert" =~ ^[0-9a-f]{64}$ ]]

          legacy_dir="$RUNNER_TEMP/legacy-v1"
          mkdir -p "$legacy_dir"
          gh release download "$LEGACY_ANDROID_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$LEGACY_ANDROID_APK_NAME" \
            --dir "$legacy_dir"
          legacy_apk="$legacy_dir/$LEGACY_ANDROID_APK_NAME"
          [[ -f "$legacy_apk" ]]

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          [[ -x "$apksigner" && -x "$aapt" ]]

          "$apksigner" verify --verbose --print-certs "$legacy_apk" > "$RUNNER_TEMP/legacy-apksigner.txt"
          legacy_cert="$(sed -n 's/.*certificate SHA-256 digest: //Ip' "$RUNNER_TEMP/legacy-apksigner.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$legacy_cert" =~ ^[0-9a-f]{64}$ ]]

          badging="$("$aapt" dump badging "$legacy_apk")"
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          [[ "$package_name" == "$ANDROID_PRODUCTION_APPLICATION_ID" ]] || {
            echo "Historical APK package mismatch: $package_name"
            exit 1
          }

          if [[ "$configured_cert" != "$legacy_cert" ]]; then
            echo "Configured Android signing key does not match the historical V1 release signer."
            echo "Configured certificate: $configured_cert"
            echo "Historical V1 certificate: $legacy_cert"
            exit 1
          fi

          {
            echo "## Android signing identity: PASS"
            echo
            echo "- Production package: \`$ANDROID_PRODUCTION_APPLICATION_ID\`"
            echo "- Historical anchor: \`$LEGACY_ANDROID_RELEASE_TAG/$LEGACY_ANDROID_APK_NAME\`"
            echo "- Certificate SHA-256: \`$legacy_cert\`"
            echo "- Result: configured keystore can perform an in-place upgrade of Android V1."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Android production signing identity matches V1."
