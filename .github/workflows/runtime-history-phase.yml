name: One-shot runtime history phase

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - scripts/runtime_history_phase.py
      - .github/workflows/runtime-history-phase.yml

permissions:
  contents: write

concurrency:
  group: runtime-history-phase
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply runtime history domain
        run: |
          python3 scripts/runtime_history_phase.py
          gofmt -w internal/repository/runtime_history.go internal/service/runtime_history.go internal/service/runtime_history_test.go internal/handler/runtime_history.go cmd/server/runtime_history_contract_test.go cmd/server/main.go cmd/server-lite/router.go cmd/server-lite/routes_admin.go
      - name: Verify Go architecture and binaries
        run: |
          go test ./...
          go build ./cmd/server-lite
          go build ./cmd/server
          grep -R 'type RuntimeHistoryService struct' internal/service/runtime_history.go
          ! grep -E 'Submit|ClaimJob|RenewJobLease|exec\.Command|CancelJob|RetryJob' internal/service/runtime_history.go
          ! grep -R -E '(POST|PUT|PATCH|DELETE)\("/runtime-history' cmd/server cmd/server-lite --include='*.go'
      - name: Verify Web typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified phase and remove one-shot files
        run: |
          rm -f scripts/runtime_history_phase.py
          rm -f .github/workflows/runtime-history-phase.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(admin): add read-only runtime history domain"
          git push origin HEAD:refactor/server-lite-v1
