name: release-publish

on:
  workflow_run:
    workflows:
      - release-server
      - release-desktop
      - release-android
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify and publish (e.g. v1.3.5)'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publish-${{ github.event.workflow_run.head_sha || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify all channels and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag and commit SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$RUN_EVENT" = "push" ]; then
            TAG="$RUN_BRANCH"
          else
            TAG=""
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Invalid release tag: ${TAG}" >&2
              exit 1
            fi
            echo "Not a version tag run; skipping auto-publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="$(gh api "repos/${REPO}/commits/refs/tags/${TAG}" --jq '.sha')"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_SHA" != "$SHA" ]; then
              echo "Run commit does not match ${TAG}."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG_REF="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
            if [ "$(jq -r '.object.type' <<< "$TAG_REF")" = "tag" ]; then
              TAG_OBJECT="$(jq -r '.object.sha' <<< "$TAG_REF")"
              TAG_MESSAGE="$(gh api "repos/${REPO}/git/tags/${TAG_OBJECT}" --jq '.message')"
              if grep -Fxq 'GitHub Release: draft' <<< "$TAG_MESSAGE"; then
                echo "Release ${TAG} was requested as a draft."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          {
            echo "skip=false"
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=${TAG} sha=${SHA}"

      - name: Wait/check all three release workflows
        if: steps.target.outputs.skip != 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          ALL_DONE=true
          ANY_FAIL=false

          for wf in release-server.yml release-desktop.yml release-android.yml; do
            INFO="$(gh api "repos/${REPO}/actions/workflows/${wf}/runs" -X GET \
              -f event=push -f "head_sha=${SHA}" -f "branch=${TAG}" -f per_page=1 \
              --jq '.workflow_runs[0] | {status: (.status // "missing"), conclusion: (.conclusion // "none"), url: (.html_url // "")}')"
            STATUS="$(printf '%s' "$INFO" | jq -r '.status')"
            CONCLUSION="$(printf '%s' "$INFO" | jq -r '.conclusion')"
            URL="$(printf '%s' "$INFO" | jq -r '.url')"
            echo "${wf}: status=${STATUS} conclusion=${CONCLUSION} ${URL}"

            if [ "$STATUS" != "completed" ]; then
              ALL_DONE=false
            elif [ "$CONCLUSION" != "success" ]; then
              ANY_FAIL=true
            fi
          done

          if [ "$ANY_FAIL" = "true" ]; then
            echo "One or more release workflows failed; keeping ${TAG} as Draft." >&2
            exit 1
          fi

          if [ "$ALL_DONE" != "true" ]; then
            echo "Waiting for remaining release workflows to complete."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify uploaded release assets and publish Release
        if: steps.target.outputs.skip != 'true' && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE="$(gh release view "$TAG" --repo "$REPO" --json assets,isDraft)"
          if [ "$(jq -r '.isDraft' <<< "$RELEASE")" = "false" ]; then
            echo "GitHub Release ${TAG} is already published."
            exit 0
          fi

          ASSETS="$(jq -r '.assets[].name' <<< "$RELEASE")"
          echo "Uploaded assets on ${TAG}:"
          printf '%s\n' "$ASSETS"

          for pattern in \
            "nowen-video-${VERSION}-linux-amd64.tar.gz" \
            "nowen-video-${VERSION}-linux-arm64.tar.gz" \
            "nowen-video-${VERSION}.fpk" \
            "SHA256SUMS-fpk.txt" \
            "Nowen.Video_${VERSION}_x64-setup.exe" \
            "Nowen.Video_${VERSION}_aarch64.dmg" \
            "nowen-video-android-${VERSION}.apk" \
            "nowen-video-android-${VERSION}.aab"; do
            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$pattern"; then
              echo "Missing expected asset: $pattern" >&2
              exit 1
            fi
          done

          if ! jq -e --arg name "nowen-video-${VERSION}.fpk" --arg label "弄文影视-${VERSION}.fpk" \
            'any(.assets[]; .name == $name and .label == $label)' <<< "$RELEASE" >/dev/null; then
            echo "Missing Chinese label for the fnOS package." >&2
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
          echo "Published GitHub Release ${TAG}."
