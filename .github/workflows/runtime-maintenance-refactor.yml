name: One-shot runtime maintenance refactor

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - .github/workflows/runtime-maintenance-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract media execution and retire runtime surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_once(path, old, new):
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, got {count}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))

          # Playback Session directly owns MediaExecutionService. No concrete
          # TranscodeService compatibility object remains in the playback path.
          path = "internal/service/playback_session.go"
          content = read(path)
          content = content.replace("\ttranscoder  *TranscodeService\n", "\texecution   *MediaExecutionService\n")
          content = content.replace("\ttranscoder *TranscodeService,\n", "\texecution *MediaExecutionService,\n")
          content = content.replace("transcoder == nil || transcoder.ExecutionRuntime() == nil", "execution == nil || execution.ExecutionRuntime() == nil")
          content = content.replace("transcoder.GetHWAccelInfo()", "execution.GetHWAccelInfo()")
          content = content.replace("transcoder.ExecutionRuntime()", "execution.ExecutionRuntime()")
          content = content.replace("\t\ttranscoder:  transcoder,\n", "\t\texecution:   execution,\n")
          content = content.replace("s.transcoder.GetCachedMediaProbe(media)", "s.execution.GetCachedMediaProbe(media)")
          if "transcoder" in content:
              raise SystemExit("playback_session.go still references transcoder")
          write(path, content)

          path = "internal/service/media_execution.go"
          content = read(path)
          content, count = re.subn(
              r"\n// playbackCompatibilityAdapter.*?\n\}\n\n// NewPlaybackSessionServiceWithExecution",
              "\n// NewPlaybackSessionServiceWithExecution",
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("media_execution.go compatibility adapter block missing")
          content = content.replace(
              "\treturn NewPlaybackSessionService(\n\t\tmediaRepo,\n\t\texecution.playbackCompatibilityAdapter(),\n\t\tcfg,\n\t\tlogger,\n\t)\n",
              "\treturn NewPlaybackSessionService(mediaRepo, execution, cfg, logger)\n",
          )
          write(path, content)

          # Stream planning may read the shared cached Probe, but media-keyed
          # Runtime HLS generation and filesystem resolution are removed.
          path = "internal/service/stream.go"
          content = read(path)
          content = content.replace("\ttranscoder  *TranscodeService\n", "\texecution   *MediaExecutionService\n")
          content = content.replace("\ttranscoder *TranscodeService,\n", "\texecution *MediaExecutionService,\n")
          content = content.replace("\t\ttranscoder: transcoder,\n", "\t\texecution:  execution,\n")
          content, count = re.subn(
              r"\n// GetMasterPlaylist 获取HLS主播放列表.*?\n// ==================== STRM 远程流代理 ====================",
              "\n// ==================== STRM 远程流代理 ====================",
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("stream.go legacy media-keyed HLS block missing")
          if "s.transcoder" in content:
              raise SystemExit("stream.go still references persistent transcoder")
          write(path, content)

          path = "internal/service/playback_planner.go"
          content = read(path).replace("s.transcoder", "s.execution")
          write(path, content)

          # One deterministic tombstone replaces all old Runtime stream handlers.
          path = "internal/handler/stream.go"
          content = read(path)
          content = content.replace("\ttranscodeService *service.TranscodeService // 用于接收播放进度上报驱动节流\n", "")
          content, count = re.subn(
              r"\n// Master 获取HLS主播放列表.*?\n// Remux 统一进入受资源治理的 Managed Remux。",
              '''
// RetiredRuntimeHLS is the authenticated compatibility tombstone for the
// removed media-keyed persistent HLS surface. Runtime media is available only
// through /api/playback/sessions.
func (h *StreamHandler) RetiredRuntimeHLS(c *gin.Context) {
\tc.Header("Cache-Control", "no-store")
\tc.JSON(http.StatusGone, gin.H{
\t\t"error": "媒体级持久 Runtime HLS 已退役，请创建播放会话",
\t\t"code":  "persistent_runtime_hls_retired",
\t})
}

// Remux 统一进入受资源治理的 Managed Remux。''',
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("stream.go handler legacy HLS block missing")
          write(path, content)

          # Admin system information reads hardware capability from the stateless
          # execution platform. Old management implementations become one 410.
          path = "internal/handler/admin.go"
          content = read(path)
          content = content.replace('\t"fmt"\n', '').replace('\t"strconv"\n', '')
          content = content.replace("\ttranscodeService  *service.TranscodeService\n", "\tmediaExecution    *service.MediaExecutionService\n")
          content = content.replace("\tmediaRepo         *repository.MediaRepo // 用于转码任务重试时解析媒体\n", "")
          content = content.replace("h.transcodeService.GetHWAccelInfo()", "h.mediaExecution.GetHWAccelInfo()")
          marker = "// ==================== 转码管理 ===================="
          if marker not in content:
              raise SystemExit("admin.go transcode section marker missing")
          content = content.split(marker, 1)[0].rstrip() + '''

// RetiredRuntimeTranscode is the sole compatibility handler for removed
// persistent Runtime task APIs. AdminOnly performs the same tombstone before
// this handler, preserving authorization-first behavior.
func (h *AdminHandler) RetiredRuntimeTranscode(c *gin.Context) {
\tc.Header("Cache-Control", "no-store")
\tc.JSON(http.StatusGone, gin.H{
\t\t"error": "持久 Runtime 转码任务已退役，请使用播放会话或管理员预处理",
\t\t"code":  "persistent_runtime_transcode_retired",
\t})
}
'''
          write(path, content)

          path = "internal/handler/handler.go"
          content = read(path)
          content = content.replace("\t\t\ttranscodeService: services.Transcode,\n", "")
          content = content.replace("\t\t\ttranscodeService:  services.Transcode,\n", "\t\t\tmediaExecution:    services.MediaExecution,\n")
          content = content.replace("\t\t\tmediaRepo:         repos.Media,\n", "")
          write(path, content)

          # Full and Lite own one MediaExecutionService and one explicit
          # ArtifactMaintenanceService. Transcode remains a temporary alias for
          # maintenance-only consumers during source migration.
          path = "internal/service/service.go"
          content = read(path)
          content = content.replace(
              "\tTranscode      *TranscodeService\n",
              "\tMediaExecution     *MediaExecutionService\n\tArtifactMaintenance *ArtifactMaintenanceService\n\tTranscode            *ArtifactMaintenanceService // deprecated alias\n",
          )
          content = content.replace(
              "\ttranscoder := NewTranscodeService(repos.Transcode, cfg, logger)\n\tregisterFullTranscodeProcessShutdown(transcoder, logger)\n",
              "\tmediaExecution, err := NewMediaExecutionService(repos.DB(), cfg, logger)\n\tif err != nil {\n\t\tpanic(fmt.Sprintf(\"initialize media execution service: %v\", err))\n\t}\n\tartifactMaintenance := NewArtifactMaintenanceService(repos.Transcode, cfg, logger)\n\tregisterFullTranscodeProcessShutdown(artifactMaintenance, logger)\n",
          )
          content = re.sub(r"\btranscoder\b", "artifactMaintenance", content)
          content = content.replace("detectedHWAccel := artifactMaintenance.GetHWAccelInfo()", "detectedHWAccel := mediaExecution.GetHWAccelInfo()")
          content = content.replace("NewStreamService(repos.Media, repos.Series, artifactMaintenance, cfg, logger)", "NewStreamService(repos.Media, repos.Series, mediaExecution, cfg, logger)")
          content = content.replace(
              "\t\tTranscode:      artifactMaintenance,\n",
              "\t\tMediaExecution:     mediaExecution,\n\t\tArtifactMaintenance: artifactMaintenance,\n\t\tTranscode:            artifactMaintenance,\n",
          )
          write(path, content)

          path = "internal/service/lite.go"
          content = read(path)
          content = content.replace('import (\n', 'import (\n\t"fmt"\n', 1)
          content = content.replace(
              "\ttranscoder := NewTranscodeService(repos.Transcode, cfg, logger)\n",
              "\tmediaExecution, err := NewMediaExecutionService(repos.DB(), cfg, logger)\n\tif err != nil {\n\t\tpanic(fmt.Sprintf(\"initialize media execution service: %v\", err))\n\t}\n\tartifactMaintenance := NewArtifactMaintenanceService(repos.Transcode, cfg, logger)\n",
          )
          content = re.sub(r"\btranscoder\b", "artifactMaintenance", content)
          content = content.replace("NewStreamService(repos.Media, repos.Series, artifactMaintenance, cfg, logger)", "NewStreamService(repos.Media, repos.Series, mediaExecution, cfg, logger)")
          content = content.replace(
              "\t\tTranscode:      artifactMaintenance,\n",
              "\t\tMediaExecution:     mediaExecution,\n\t\tArtifactMaintenance: artifactMaintenance,\n\t\tTranscode:            artifactMaintenance,\n",
          )
          write(path, content)

          # Maintenance construction keeps historical migration and cleanup but
          # never creates Probe/Runtime, detects hardware or starts a Worker.
          path = "internal/service/transcode.go"
          content = read(path)
          constructor = '''func NewArtifactMaintenanceService(repo *repository.TranscodeRepo, cfg *config.Config, logger *zap.SugaredLogger) *ArtifactMaintenanceService {
\tif repo == nil || repo.DB() == nil {
\t\tpanic("transcode repository is required")
\t}
\tif cfg == nil {
\t\tpanic("configuration is required")
\t}
\tif logger == nil {
\t\tlogger = zap.NewNop().Sugar()
\t}
\tif err := model.AutoMigrateTranscodeExecution(repo.DB()); err != nil {
\t\tpanic(fmt.Sprintf("migrate transcode execution schema: %v", err))
\t}
\texecutionRepo := repository.NewTranscodeExecutionRepo(repo.DB())
\tartifactStore, err := transcodeartifactstore.New(filepath.Join(cfg.Cache.CacheDir, "transcode"))
\tif err != nil {
\t\tpanic(fmt.Sprintf("initialize transcode artifact store: %v", err))
\t}
\tservice := &TranscodeService{
\t\trepo:                   repo,
\t\texecutionRepo:          executionRepo,
\t\tcfg:                    cfg,
\t\tlogger:                 logger,
\t\tjobs:                   newTranscodePriorityQueue(executionRepo, repo, 1, logger),
\t\trunning:                make(map[string]*TranscodeJob),
\t\tinstanceID:             newTranscodeInstanceID(),
\t\tleaseDuration:          defaultTranscodeLeaseDuration,
\t\tleaseHeartbeatInterval: defaultTranscodeLeaseHeartbeatInterval,
\t\tleaseRecoveryInterval:  defaultTranscodeLeaseRecoveryInterval,
\t\tartifactStore:          artifactStore,
\t\tdiskUsageTTL:           30 * time.Second,
\t}
\tservice.recoverPendingTasks()
\tgo service.leaseRecoveryLoop()
\treturn service
}

// NewTranscodeService is retained only for source compatibility. It returns a
// maintenance-only service and cannot start Runtime execution.
func NewTranscodeService(repo *repository.TranscodeRepo, cfg *config.Config, logger *zap.SugaredLogger) *TranscodeService {
\treturn NewArtifactMaintenanceService(repo, cfg, logger)
}
'''
          content = content.replace("const EventTranscodeCancelled = \"transcode_cancelled\"\n", "const EventTranscodeCancelled = \"transcode_cancelled\"\n\n// ArtifactMaintenanceService is the formal owner of historical migration and durable Artifact cleanup.\ntype ArtifactMaintenanceService = TranscodeService\n")
          content, count = re.subn(
              r"func NewTranscodeService\(.*?\n\}\n\nfunc \(s \*TranscodeService\) SetWSHub",
              constructor + "\nfunc (s *TranscodeService) SetWSHub",
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("transcode constructor block missing")
          content = content.replace("\ts.attachProbeWarmup(hub)\n", "")
          content = content.replace("func (s *TranscodeService) GetHWAccelInfo() string                      { return s.hwAccel }", "func (s *TranscodeService) GetHWAccelInfo() string { return ffmpeg.HWAccelNone }")
          content = content.replace("func (s *TranscodeService) ExecutionRuntime() *transcoderuntime.Runtime { return s.executionRuntime }", "func (s *TranscodeService) ExecutionRuntime() *transcoderuntime.Runtime { return nil }")
          retired_submit = '''func (s *TranscodeService) StartTranscode(*model.Media, string) (*model.TranscodeTask, error) {
\treturn nil, ErrPersistentRuntimeTranscodeRetired
}

func (s *TranscodeService) StartABRTranscode(*model.Media, []string) ([]*model.TranscodeTask, error) {
\treturn nil, ErrPersistentRuntimeTranscodeRetired
}

func (s *TranscodeService) StartTranscodeWithStart(*model.Media, string, float64) (*model.TranscodeTask, error) {
\treturn nil, ErrPersistentRuntimeTranscodeRetired
}

func (s *TranscodeService) startTranscodeInternal(*model.Media, string, float64) (*model.TranscodeTask, error) {
\treturn nil, ErrPersistentRuntimeTranscodeRetired
}

func (s *TranscodeService) startTranscodeWithPriority(*model.Media, string, float64, int) (*model.TranscodeTask, error) {
\treturn nil, ErrPersistentRuntimeTranscodeRetired
}

// WaitForFirstSegment is retired with media-keyed Runtime HLS.
func (s *TranscodeService) WaitForFirstSegment(context.Context, string, string) error {
\treturn ErrPersistentRuntimeTranscodeRetired
}
'''
          content, count = re.subn(
              r"func \(s \*TranscodeService\) StartTranscode\(.*?\nfunc \(s \*TranscodeService\) worker",
              retired_submit + "\nfunc (s *TranscodeService) worker",
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("transcode submission block missing")
          write(path, content)

          # Full/Lite reuse the MediaExecution instance created by Services.
          path = "cmd/server-lite/main.go"
          content = read(path)
          content, count = re.subn(
              r"\tmediaExecution, err := service.NewMediaExecutionService\(repos.DB\(\), cfg, sugar\).*?\t}\n\tplaybackSessions, err := service.NewPlaybackSessionServiceWithExecution\(",
              "\tplaybackSessions, err := service.NewPlaybackSessionServiceWithExecution(\n",
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("server-lite duplicate MediaExecution block missing")
          content = content.replace("\t\tmediaExecution,\n", "\t\tservices.MediaExecution,\n", 1)
          content = content.replace("if services.Transcode != nil", "if services.ArtifactMaintenance != nil")
          content = content.replace("services.Transcode.Shutdown", "services.ArtifactMaintenance.Shutdown")
          write(path, content)

          path = "cmd/server/playback_sessions.go"
          content = read(path)
          content, count = re.subn(
              r"\tmediaExecution, err := service.NewMediaExecutionService\(repos.DB\(\), cfg, logger\).*?\t}\n",
              "\tmediaExecution := services.MediaExecution\n\tif mediaExecution == nil {\n\t\treturn nil, fmt.Errorf(\"media execution service is required\")\n\t}\n",
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("full duplicate MediaExecution block missing")
          if '"fmt"' not in content:
              content = content.replace('import (\n', 'import (\n\t"fmt"\n', 1)
          write(path, content)

          # Existing routes remain registered but point only at deterministic
          # tombstones, so authentication behavior is preserved.
          admin_methods = [
              "TranscodeStatus", "TranscodeThrottleStats", "CancelTranscode",
              "ListTranscodeTasks", "GetTranscodeStatistics", "BatchCancelTranscodeTasks",
              "BatchDeleteTranscodeTasks", "BatchRetryTranscodeTasks", "BatchSubmitTranscodeTasks",
              "CancelTranscodeTask", "RetryTranscodeTask", "DeleteTranscodeTask",
          ]
          for path in ["cmd/server/main.go", "cmd/server-lite/routes_admin.go"]:
              content = read(path)
              for method in admin_methods:
                  content = content.replace(f"handlers.Admin.{method}", "handlers.Admin.RetiredRuntimeTranscode")
              write(path, content)

          stream_methods = ["Master", "Segment", "AudioPlaylist", "AudioSegment"]
          for path in ["cmd/server/main.go", "cmd/server-lite/routes_stream.go"]:
              if not Path(path).exists():
                  continue
              content = read(path)
              for method in stream_methods:
                  content = content.replace(f"handlers.Stream.{method}", "handlers.Stream.RetiredRuntimeHLS")
              write(path, content)

          gate = '''package main

import (
\t"os"
\t"strings"
\t"testing"
)

func TestPersistentRuntimeExecutionSurfaceRemoved(t *testing.T) {
\trequireSource(t, "../../internal/service/transcode.go", "type ArtifactMaintenanceService = TranscodeService")
\trequireSource(t, "../../internal/service/transcode.go", "NewArtifactMaintenanceService")
\trequireSource(t, "../../internal/service/playback_session.go", "execution   *MediaExecutionService")
\trequireSource(t, "../../internal/service/stream.go", "execution   *MediaExecutionService")
\trequireSource(t, "../../internal/handler/admin.go", "RetiredRuntimeTranscode")
\trequireSource(t, "../../internal/handler/stream.go", "RetiredRuntimeHLS")

\tfor _, check := range []struct{ path, marker string }{
\t\t{"../../internal/service/transcode.go", "go service.worker"},
\t\t{"../../internal/service/transcode.go", "转码 Worker 启动"},
\t\t{"../../internal/service/media_execution.go", "playbackCompatibilityAdapter"},
\t\t{"../../internal/service/playback_session.go", "*TranscodeService"},
\t\t{"../../internal/service/stream.go", "s.transcoder"},
\t\t{"../../internal/service/stream.go", "GetMasterPlaylistFiltered"},
\t\t{"../../internal/handler/admin.go", "ListTranscodeTasks"},
\t\t{"../../internal/handler/stream.go", "func (h *StreamHandler) Master"},
\t} {
\t\tcontent, err := os.ReadFile(check.path)
\t\tif err != nil { t.Fatalf("read %s: %v", check.path, err) }
\t\tif strings.Contains(string(content), check.marker) {
\t\t\tt.Fatalf("%s still contains retired marker %q", check.path, check.marker)
\t\t}
\t}
}

func requireSource(t *testing.T, path, marker string) {
\tt.Helper()
\tcontent, err := os.ReadFile(path)
\tif err != nil { t.Fatalf("read %s: %v", path, err) }
\tif !strings.Contains(string(content), marker) {
\t\tt.Fatalf("%s is missing architecture marker %q", path, marker)
\t}
}
'''
          write("cmd/server/runtime_worker_removed_test.go", gate)
          PY

          gofmt -w \
            internal/service/playback_session.go \
            internal/service/media_execution.go \
            internal/service/stream.go \
            internal/service/playback_planner.go \
            internal/service/service.go \
            internal/service/lite.go \
            internal/service/transcode.go \
            internal/handler/stream.go \
            internal/handler/admin.go \
            internal/handler/handler.go \
            cmd/server/playback_sessions.go \
            cmd/server-lite/main.go \
            cmd/server/runtime_worker_removed_test.go

      - name: Verify Go architecture and builds
        run: |
          go test ./...
          go build ./cmd/server-lite
          go build ./cmd/server

      - name: Commit refactor and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/runtime-maintenance-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(transcode): extract artifact maintenance service"
          git push origin HEAD:refactor/server-lite-v1
