name: One-shot runtime maintenance refactor

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - scripts/runtime_maintenance_refactor.py
      - scripts/runtime_maintenance_refactor_fix.py
      - scripts/runtime_maintenance_refactor_fix2.py
      - .github/workflows/runtime-maintenance-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply runtime maintenance refactor
        run: |
          python3 scripts/runtime_maintenance_refactor.py
          python3 scripts/runtime_maintenance_refactor_fix.py
          python3 scripts/runtime_maintenance_refactor_fix2.py
          gofmt -w \
            internal/service/playback_session.go \
            internal/service/media_execution.go \
            internal/service/media_execution_test.go \
            internal/service/stream.go \
            internal/service/stream_managed_remux.go \
            internal/service/playback_planner.go \
            internal/service/service.go \
            internal/service/lite.go \
            internal/service/transcode.go \
            internal/handler/stream.go \
            internal/handler/admin.go \
            internal/handler/handler.go \
            internal/handler/lite.go \
            cmd/server/playback_sessions.go \
            cmd/server-lite/main.go \
            cmd/server/runtime_worker_removed_test.go

      - name: Verify Go architecture and builds
        run: |
          go test ./...
          go build ./cmd/server-lite
          go build ./cmd/server

      - name: Commit refactor and remove one-shot files
        run: |
          rm .github/workflows/runtime-maintenance-refactor.yml
          rm scripts/runtime_maintenance_refactor.py
          rm scripts/runtime_maintenance_refactor_fix.py
          rm scripts/runtime_maintenance_refactor_fix2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(transcode): extract artifact maintenance service"
          git push origin HEAD:refactor/server-lite-v1
