name: Transcode Long Duration Profile Matrix

on:
  pull_request:
    paths:
      - 'cmd/transcode-long-duration-profile-cert/**'
      - 'cmd/transcode-real-media-corpus-generate/**'
      - 'internal/transcode/longdrift/contract.go'
      - 'internal/transcode/longdrift/contract_test.go'
      - 'internal/transcode/longdrift/policy.go'
      - 'internal/transcode/longdrift/policy_test.go'
      - 'internal/transcode/longdrift/profile_matrix.go'
      - 'internal/transcode/longdrift/profile_matrix_test.go'
      - 'internal/transcode/corpusgenerator/**'
      - 'internal/transcode/realmediacorpus/**'
      - 'internal/transcode/realmediacandidate/**'
      - 'internal/transcode/timebasecandidate/**'
      - 'internal/transcode/reordercandidate/**'
      - 'internal/transcode/certification/long_duration_drift_*.go'
      - 'internal/transcode/certification/long_duration_profile_*.go'
      - 'internal/transcode/certification/real_media_candidate_*.go'
      - '.github/scripts/verify_long_duration_profile_matrix.py'
      - '.github/scripts/verify_real_media_corpus_manifest.py'
      - '.github/workflows/transcode-long-duration-profile-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcode-long-duration-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-corpus:
    name: Build profile adapters and immutable corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify profile contracts and commands
        run: |
          go test ./internal/transcode/longdrift
          go test ./internal/transcode/realmediacorpus
          go test ./internal/transcode/corpusgenerator
          go test ./internal/transcode/certification
          go build -trimpath -o /tmp/nowen-transcode-real-media-corpus-generate ./cmd/transcode-real-media-corpus-generate
          go build -trimpath -o /tmp/nowen-transcode-long-duration-profile-cert ./cmd/transcode-long-duration-profile-cert
          python3 -m py_compile .github/scripts/verify_long_duration_profile_matrix.py
      - name: Generate deterministic file-backed corpus
        run: |
          rm -rf /tmp/nowen-transcode-real-media-corpus-v1
          /tmp/nowen-transcode-real-media-corpus-generate \
            -output-dir /tmp/nowen-transcode-real-media-corpus-v1
      - name: Verify immutable corpus
        run: |
          python3 .github/scripts/verify_real_media_corpus_manifest.py \
            /tmp/nowen-transcode-real-media-corpus-v1/real-media-corpus-manifest-v1.json
          du -sh /tmp/nowen-transcode-real-media-corpus-v1
      - name: Upload immutable corpus
        uses: actions/upload-artifact@v4
        with:
          name: transcode-long-duration-profile-corpus-${{ github.sha }}
          path: /tmp/nowen-transcode-real-media-corpus-v1
          if-no-files-found: error
          retention-days: 7

  certify-profiles:
    name: Certify five 30-minute timing profiles
    needs: generate-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download immutable corpus
        uses: actions/download-artifact@v4
        with:
          name: transcode-long-duration-profile-corpus-${{ github.sha }}
          path: /tmp/nowen-transcode-real-media-corpus-v1
      - name: Build profile certification command
        run: go build -trimpath -o /tmp/nowen-transcode-long-duration-profile-cert ./cmd/transcode-long-duration-profile-cert
      - name: Run long-duration profile matrix
        run: |
          /tmp/nowen-transcode-long-duration-profile-cert \
            -corpus-root /tmp/nowen-transcode-real-media-corpus-v1 \
            -output /tmp/long-duration-profile-matrix-v2.json \
            -timeout 220m
      - name: Independently verify profile evidence
        run: |
          python3 .github/scripts/verify_long_duration_profile_matrix.py \
            /tmp/long-duration-profile-matrix-v2.json
          du -h /tmp/long-duration-profile-matrix-v2.json
      - name: Upload profile matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcode-long-duration-profile-matrix-${{ github.sha }}
          path: /tmp/long-duration-profile-matrix-v2.json
          if-no-files-found: error
          retention-days: 7
