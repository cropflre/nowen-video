name: One-shot transcode projection audit

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - .github/workflows/one-shot-transcode-projection-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - name: Inventory legacy task projection
        shell: bash
        run: |
          set -o pipefail
          grep_tree() {
            local pattern="$1"
            shift
            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=vendor \
              --exclude-dir=node_modules \
              --exclude='server' \
              --exclude='server-lite' \
              "$pattern" "$@" || true
          }
          echo '=== TranscodeTask / transcode_tasks ==='
          grep_tree 'TranscodeTask|transcode_tasks|LegacyTaskID|legacy_task_id' .
          echo '=== Artifact cleanup and filesystem ownership ==='
          grep_tree 'TranscodeArtifactRecord|CleanupState|cleanup_state|ArtifactMaintenance|CleanupArtifact|MigrationSource|migration_source' internal cmd docs
          echo '=== Runtime history ==='
          grep_tree 'RuntimeHistory|runtime-history|legacy_task' internal cmd web docs
          echo '=== Current transcode model migrations ==='
          grep_tree 'AutoMigrate|TranscodeTask|TranscodeJobRecord|TranscodeArtifactRecord' internal/model internal/serverprofile cmd
