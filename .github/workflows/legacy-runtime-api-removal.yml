name: One-shot legacy Runtime API removal

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - scripts/remove_legacy_runtime_api.py
      - scripts/remove_legacy_runtime_api_fix.py
      - .github/workflows/legacy-runtime-api-removal.yml

permissions:
  contents: write

concurrency:
  group: legacy-runtime-api-removal
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-lite-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Remove legacy Runtime API surface
        run: |
          python3 scripts/remove_legacy_runtime_api_fix.py
          python3 scripts/remove_legacy_runtime_api.py
          gofmt -w internal/middleware/middleware.go internal/handler/stream.go internal/handler/admin.go cmd/server/main.go cmd/server-lite/routes_core.go cmd/server-lite/routes_admin.go cmd/server/legacy_runtime_api_removed_test.go
          git diff --check
      - name: Verify backend contracts and binaries
        run: |
          go test ./...
          go build ./cmd/server-lite
          go build ./cmd/server
          ! grep -R -E 'RetiredRuntimeHLS|RetiredRuntimeTranscode|retiredPersistentRuntimeAdminPath' cmd internal --include='*.go' --exclude='*_test.go'
          ! grep -R -E '(/stream/:id/master\.m3u8|/stream/:id/:quality/:segment|/stream/:id/playback|/stream/:id/bandwidth|/stream/:id/throttle|/audio-track/:id/:trackIdx|/transcode-tasks|/transcode/status)' cmd internal --include='*.go' --exclude='*_test.go'
          grep -F 'api.POST("/playback/sessions"' cmd/server-lite/routes_core.go
          grep -F 'playbackRuntime.Register(api, guardByMediaID)' cmd/server/main.go
          grep -F 'admin.GET("/runtime-history"' cmd/server/main.go cmd/server-lite/routes_admin.go
          grep -F 'api.GET("/preprocess/media/:id/master.m3u8"' cmd/server/main.go
          test ! -e web/src/components/preprocess/TranscodeJobsPanel.tsx
      - name: Verify Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
          ! grep -R -E '(/admin/transcode-tasks|/admin/transcode/status|/stream/.*/master\.m3u8|persistent_runtime_hls_retired|persistent_runtime_transcode_retired)' dist
      - name: Commit verified phase and remove one-shot files
        run: |
          rm -f scripts/remove_legacy_runtime_api.py
          rm -f scripts/remove_legacy_runtime_api_fix.py
          rm -f .github/workflows/legacy-runtime-api-removal.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(api): remove retired Runtime compatibility surface"
          git push origin HEAD:refactor/server-lite-v1
