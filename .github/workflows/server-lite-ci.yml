name: Server Lite CI

on:
  push:
    branches:
      - refactor/server-lite-v1
  pull_request:
    paths:
      - 'cmd/server-lite/**'
      - 'cmd/server/**'
      - 'internal/service/lite.go'
      - 'internal/service/task_center.go'
      - 'internal/service/task_center_test.go'
      - 'internal/service/playback_planner.go'
      - 'internal/service/playback_planner_test.go'
      - 'internal/service/playback_startup*.go'
      - 'internal/service/stream_startup_bridge*.go'
      - 'internal/service/transcode*.go'
      - 'internal/service/stream_artifacts.go'
      - 'internal/service/ondemand.go'
      - 'internal/handler/lite.go'
      - 'internal/handler/handler.go'
      - 'internal/handler/stream_artifacts.go'
      - 'internal/handler/stream_startup_bridge.go'
      - 'internal/handler/task_center.go'
      - 'internal/handler/playback_plan.go'
      - 'internal/model/migrate_lite.go'
      - 'internal/model/transcode_execution.go'
      - 'internal/model/transcode_handoff*.go'
      - 'internal/model/transcode_*migration_test.go'
      - 'internal/repository/repo_transcode*.go'
      - 'internal/transcode/**'
      - 'internal/middleware/security.go'
      - 'internal/middleware/**/*_test.go'
      - 'internal/serverprofile/**'
      - 'docs/TRANSCODE_*.md'
      - 'docs/PLAYBACK_*.md'
      - 'web/**'
      - 'clients/android-v2/**'
      - 'Dockerfile'
      - 'Dockerfile.full'
      - 'Makefile'
      - '.github/workflows/server-lite-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test Go packages
        run: go test ./...
      - name: Encoding plan value-object contract
        run: go test ./internal/transcode/encodingplan
      - name: Timestamp normalization value-object contract
        run: go test ./internal/transcode/timestampplan -run 'Plan|TimestampPolicy'
      - name: Real FFmpeg timestamp-origin fixture
        env:
          NOWEN_REQUIRE_FFMPEG_TIMESTAMP_FIXTURE: '1'
        run: go test ./internal/transcode/timestampplan -run '^TestFFmpegCopyTSStartAtZeroPreservesContinuationOrigin$' -count=1 -v
      - name: Produced media attestation contract
        run: go test ./internal/transcode/attestation
      - name: Timeline continuity contract
        run: go test ./internal/transcode/timeline
      - name: Execution plan, migration, attestation and resolver contract
        run: go test ./internal/model ./internal/repository ./internal/service -run 'EncodingPlan|Timestamp|Attestation|Startup|Handoff|Timeline'
      - name: Startup stream planner and bridge contract
        run: go test ./internal/service -run 'Startup|Playback|EncodingPlan|Timestamp|Attestation|Handoff|Timeline'
      - name: Plan and attestation race verification
        run: go test -race ./internal/transcode/encodingplan ./internal/transcode/timestampplan ./internal/transcode/attestation ./internal/transcode/timeline
      - name: Artifact lease and filesystem race tests
        run: go test -race ./internal/repository ./internal/transcode/artifactstore ./internal/service -run 'Artifact|EncodingPlan|Timestamp|Attestation|Handoff|Timeline|Lease|Shutdown'
      - name: Previous attested resolver performance baseline
        run: go test ./internal/repository -run '^$' -bench '^BenchmarkFindReadableArtifactByEncodingPlan$' -benchtime=100x -benchmem
      - name: Timestamp-fenced resolver performance baseline
        run: go test ./internal/repository -run '^$' -bench '^BenchmarkFindReadableArtifactByExecutionContract$' -benchtime=100x -benchmem
      - name: Handoff contract lookup performance baseline
        run: go test ./internal/repository -run '^$' -bench '^BenchmarkFindHandoffAttestation$' -benchtime=100x -benchmem
      - name: Build lite server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nowen-video-lite ./cmd/server-lite
      - name: Build full server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nowen-video-full ./cmd/server

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Reject retired Pulse UI copy
        run: |
          if grep -R -n -E 'Pulse 数据中心|Pulse (Data )?Center|Pulse データセンター|nav\.pulse|pulse\.' dist; then
            echo 'Retired Pulse UI copy must not be present in production assets.' >&2
            exit 1
          fi

  docker:
    name: Docker lite and full deployment smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lite image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: nowen-video:lite-ci
          build-args: |
            NOWEN_VERSION=ci
          cache-from: type=gha,scope=server-lite
          cache-to: type=gha,mode=max,scope=server-lite
      - name: Build full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          push: false
          load: true
          tags: nowen-video:full-ci
          build-args: |
            NOWEN_VERSION=ci
          cache-from: type=gha,scope=server-full
          cache-to: type=gha,mode=max,scope=server-full
      - name: Start lite and full with persistent volumes
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f nowen-lite-smoke nowen-full-smoke >/dev/null 2>&1 || true
            docker volume rm -f nowen-lite-data-ci nowen-lite-cache-ci nowen-full-data-ci nowen-full-cache-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_health() {
            local name="$1"
            local port="$2"
            for _ in $(seq 1 90); do
              if curl --fail --silent --show-error "http://127.0.0.1:${port}/api/health" >/dev/null; then
                return 0
              fi
              if ! docker inspect "$name" >/dev/null 2>&1 || [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                docker logs "$name" || true
                return 1
              fi
              sleep 1
            done
            docker logs "$name" || true
            return 1
          }

          smoke_profile() {
            local profile="$1"
            local image="$2"
            local port="$3"
            local data_volume="nowen-${profile}-data-ci"
            local cache_volume="nowen-${profile}-cache-ci"
            local container="nowen-${profile}-smoke"

            docker volume create "$data_volume" >/dev/null
            docker volume create "$cache_volume" >/dev/null
            docker run -d \
              --name "$container" \
              -p "${port}:8080" \
              -v "${data_volume}:/data" \
              -v "${cache_volume}:/cache" \
              "$image" >/dev/null
            wait_health "$container" "$port"
            docker exec "$container" test -s /data/nowen.db
            docker exec "$container" test -d /cache/transcode

            # Restart the exact image against the same volumes. This exercises
            # additive migrations, Artifact startup reconciliation and normal
            # ownership/permission handling rather than only a cold boot.
            docker rm -f "$container" >/dev/null
            docker run -d \
              --name "$container" \
              -p "${port}:8080" \
              -v "${data_volume}:/data" \
              -v "${cache_volume}:/cache" \
              "$image" >/dev/null
            wait_health "$container" "$port"
            docker exec "$container" test -s /data/nowen.db
            docker exec "$container" test -d /cache/transcode/workspaces
            docker exec "$container" test -d /cache/transcode/artifacts
            docker rm -f "$container" >/dev/null
          }

          smoke_profile lite nowen-video:lite-ci 18080
          smoke_profile full nowen-video:full-ci 18081
