name: Server Lite CI

on:
  push:
    branches:
      - refactor/server-lite-v1
  pull_request:
    paths:
      - 'cmd/server-lite/**'
      - 'internal/service/lite.go'
      - 'internal/handler/lite.go'
      - 'internal/model/migrate_lite.go'
      - 'web/**'
      - 'Dockerfile'
      - 'Dockerfile.full'
      - 'Makefile'
      - '.github/workflows/server-lite-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test Go packages
        run: go test ./...
      - name: Build lite server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nowen-video-lite ./cmd/server-lite
      - name: Build full server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nowen-video-full ./cmd/server

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker lite and full images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lite image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          tags: nowen-video:lite-ci
          build-args: |
            NOWEN_VERSION=ci
          cache-from: type=gha,scope=server-lite
          cache-to: type=gha,mode=max,scope=server-lite
      - name: Build full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          push: false
          load: false
          tags: nowen-video:full-ci
          build-args: |
            NOWEN_VERSION=ci
          cache-from: type=gha,scope=server-full
          cache-to: type=gha,mode=max,scope=server-full
