name: Server Lite CI

on:
  push:
    branches:
      - refactor/server-lite-v1
  pull_request:
    paths:
      - 'cmd/server-lite/**'
      - 'internal/service/lite.go'
      - 'internal/handler/lite.go'
      - 'web/**'
      - 'Dockerfile'
      - 'Dockerfile.full'
      - 'Makefile'
      - '.github/workflows/server-lite-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test Go packages
        run: go test ./...
      - name: Build lite server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nowen-video-lite ./cmd/server-lite
      - name: Build full server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nowen-video-full ./cmd/server

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
