name: Desktop CI

on:
  push:
    branches:
      - main
      - refactor/server-lite-v1
    paths:
      - 'desktop/**'
      - 'web/src/desktop/**'
      - 'web/src/api/mediaAnalysis.ts'
      - 'web/src/App.tsx'
      - 'internal/service/media_analysis_worker*.go'
      - 'internal/service/media_analysis_preview_compute*.go'
      - 'scripts/fetch-assets.ps1'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/release-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'web/src/desktop/**'
      - 'web/src/api/mediaAnalysis.ts'
      - 'web/src/App.tsx'
      - 'internal/service/media_analysis_worker*.go'
      - 'internal/service/media_analysis_preview_compute*.go'
      - 'scripts/fetch-assets.ps1'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/release-desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Windows Tauri + libmpv compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Cache libmpv resource
        uses: actions/cache@v4
        id: mpv-cache
        with:
          path: desktop/src-tauri/resources/mpv
          key: desktop-ci-mpv-${{ hashFiles('scripts/fetch-assets.ps1') }}

      - name: Fetch libmpv only
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-assets.ps1 -Skip 'yt-dlp;shaders;fonts'

      - name: Verify libmpv resource
        shell: pwsh
        run: |
          $dll = 'desktop/src-tauri/resources/mpv/libmpv-2.dll'
          if (-not (Test-Path $dll)) {
            throw "Desktop CI 缺少 libmpv-2.dll: $dll"
          }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Compile desktop Rust contract
        shell: pwsh
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Verify media compute libmpv source contract
        shell: pwsh
        run: |
          $source = Get-Content 'desktop/src-tauri/src/highlight_compute.rs' -Raw
          if ($source -notmatch 'highlight_capture_frame') { throw '缺少 highlight_capture_frame 命令' }
          if ($source -notmatch 'vo-image-format", "webp') { throw '桌面媒体计算必须输出 WebP' }
          if ($source -notmatch 'hwdec", "auto-copy') { throw '桌面媒体计算必须保留安全硬解回拷模式' }
          if ($source -notmatch 'frames", 1_i64') { throw '桌面媒体计算必须限制单次只抽取一帧' }

          $agent = Get-Content 'web/src/desktop/DesktopHighlightComputeAgent.tsx' -Raw
          if ($agent -notmatch 'MEDIA_COMPUTE_JOB_HIGHLIGHT_V1') { throw 'Desktop 缺少 highlight_v1 执行器' }
          if ($agent -notmatch 'MEDIA_COMPUTE_JOB_PREVIEW_THUMBNAIL_V1') { throw 'Desktop 缺少 preview_thumbnail_v1 执行器' }
          if ($agent -notmatch 'processPreviewThumbnailClaim') { throw 'Desktop 缺少预览图任务处理函数' }
          if ($agent -notmatch 'capturePreviewFrame') { throw 'Desktop 预览图任务必须复用单帧捕获能力' }
