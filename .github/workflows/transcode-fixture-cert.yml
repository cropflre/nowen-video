name: Transcode Fixture Certification

on:
  push:
    branches:
      - refactor/server-lite-v1
    paths:
      - 'cmd/transcode-fixture-cert/**'
      - 'internal/service/ffmpeg/**'
      - 'internal/service/transcode_quality.go'
      - 'internal/service/transcode_startup.go'
      - 'internal/service/transcode_timestamp_plan.go'
      - 'internal/transcode/attestation/**'
      - 'internal/transcode/certification/**'
      - 'internal/transcode/encodingplan/**'
      - 'internal/transcode/timeline/**'
      - 'internal/transcode/timestampplan/**'
      - 'docs/TRANSCODE_FIXTURE_CERTIFICATION.md'
      - '.github/workflows/transcode-fixture-cert.yml'
  pull_request:
    paths:
      - 'cmd/transcode-fixture-cert/**'
      - 'internal/service/ffmpeg/**'
      - 'internal/service/transcode_quality.go'
      - 'internal/service/transcode_startup.go'
      - 'internal/service/transcode_timestamp_plan.go'
      - 'internal/transcode/attestation/**'
      - 'internal/transcode/certification/**'
      - 'internal/transcode/encodingplan/**'
      - 'internal/transcode/timeline/**'
      - 'internal/transcode/timestampplan/**'
      - 'docs/TRANSCODE_FIXTURE_CERTIFICATION.md'
      - '.github/workflows/transcode-fixture-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcode-fixture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlap-attribution:
    name: CFR overlap attribution matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify fixture contracts
        run: go test ./internal/transcode/certification ./internal/transcode/timestampplan
      - name: Build certification command
        run: go build -trimpath -o /tmp/nowen-transcode-fixture-cert ./cmd/transcode-fixture-cert
      - name: Produce real-media matrix evidence
        run: |
          mkdir -p /tmp/nowen-transcode-certification
          /tmp/nowen-transcode-fixture-cert \
            -all \
            -output /tmp/nowen-transcode-certification/cfr-overlap-attribution-matrix-v1.json
          cat /tmp/nowen-transcode-certification/cfr-overlap-attribution-matrix-v1.json
      - name: Verify matrix identities and fail-closed policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/nowen-transcode-certification/cfr-overlap-attribution-matrix-v1.json')
          matrix = json.loads(path.read_text())
          assert matrix['schema_version'] == 'ffmpeg-handoff-fixture-matrix-v1'
          required = {
              'cfr-h264-aac-48k-software-v1',
              'cfr-h264-aac-48k-software-zerolatency-v1',
              'cfr-h264-aac-44k1-software-zerolatency-v1',
          }
          reports = {report['fixture_id']: report for report in matrix['reports']}
          assert set(reports) == required
          for report in reports.values():
              assert report['schema_version'] == 'ffmpeg-handoff-fixture-report-v2'
              assert report['handoff']['seamless_allowed'] is False
              assert report['handoff']['discontinuity_required'] is True
              assert report['handoff']['status'] in {'aligned', 'gap', 'overlap', 'mixed'}
          comparisons = {item['name']: item for item in matrix['comparisons']}
          assert set(comparisons) == {
              'x264_zerolatency_effect_48k',
              'aac_sample_rate_effect_zerolatency',
          }
          print(json.dumps({
              fixture_id: {
                  'status': report['handoff']['status'],
                  'video_pts_delta_us': report['handoff']['video_presentation_delta_micros'],
                  'audio_pts_delta_us': report['handoff']['audio_presentation_delta_micros'],
              }
              for fixture_id, report in reports.items()
          }, sort_keys=True))
          print(json.dumps(comparisons, sort_keys=True))
          PY
      - name: Upload certification matrix
        uses: actions/upload-artifact@v4
        with:
          name: transcode-fixture-overlap-matrix-${{ github.sha }}
          path: /tmp/nowen-transcode-certification/cfr-overlap-attribution-matrix-v1.json
          if-no-files-found: error
          retention-days: 14
