# Nowen Video Desktop 2.0 — Windows release / RC build
#
# Trigger:
#  1. push tag v*.*.*   -> build Windows NSIS + attach to draft Release
#  2. workflow_dispatch -> build Windows RC artifact only
#
# Desktop 2.0 首发只保证 Windows x64。macOS/Linux 在各自 Render Surface
# 完成前不进入正式发布矩阵。
name: release-desktop
run-name: >-
  release-desktop
  ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_name || '0.1.0' }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Product version, for example 2.0.0-rc.1'
        required: false
        default: '2.0.0-rc.1'

jobs:
  fetch-assets:
    name: 准备 Windows Desktop 运行资源
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Desktop 运行资源
        uses: actions/cache@v4
        id: desktop-resource-cache
        with:
          path: desktop/src-tauri/resources
          key: desktop2-resources-v2-${{ hashFiles('scripts/fetch-assets.ps1') }}

      - name: 下载 libmpv / yt-dlp / 字幕字体
        if: steps.desktop-resource-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-assets.ps1 -Skip "shaders"

      - name: 严格校验 Desktop 运行资源
        shell: pwsh
        run: |
          $mpv = "desktop/src-tauri/resources/mpv/libmpv-2.dll"
          $ytdlp = "desktop/src-tauri/resources/yt-dlp.exe"
          $fonts = "desktop/src-tauri/resources/fonts"
          if (-not (Test-Path $mpv)) { throw "缺少 libmpv-2.dll" }
          if ((Get-Item $mpv).Length -lt 10MB) { throw "libmpv-2.dll 尺寸异常" }
          if (-not (Test-Path $ytdlp)) { throw "缺少 yt-dlp.exe" }
          if (-not (Test-Path $fonts)) { throw "缺少字幕字体目录" }
          if ((Get-ChildItem $fonts -File -Recurse | Measure-Object).Count -eq 0) { throw "字幕字体目录为空" }
          Write-Host "[OK] Desktop 运行资源完整" -ForegroundColor Green

      - name: 上传 Desktop 运行资源
        uses: actions/upload-artifact@v4
        with:
          name: desktop-resources
          path: desktop/src-tauri/resources
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: 构建 Windows x64 RC
    needs: fetch-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 下载 Desktop 运行资源
        uses: actions/download-artifact@v4
        with:
          name: desktop-resources
          path: desktop/src-tauri/resources

      - name: 校验 Desktop 2.0 架构契约
        shell: pwsh
        run: ./desktop/scripts/verify-desktop2-architecture.ps1

      - name: 解析并同步产品版本
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.version_name }}' }
          $version = $version -replace '^v',''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid product version: $version"
          }
          "NOWEN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          pwsh -ExecutionPolicy Bypass -File ./scripts/sync-version.ps1 -Version $version

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: 构建正式 Go Media Core Sidecar
        shell: pwsh
        run: ./desktop/scripts/build-sidecar.ps1 -Production

      - name: 安装 Web 依赖
        working-directory: web
        run: npm ci

      - name: 构建 Web 产品界面
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.NOWEN_VERSION }}

      - name: 检查 Rust / Windows Render API
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: 构建 Windows NSIS 安装包
        working-directory: desktop/src-tauri
        env:
          NOWEN_VERSION: ${{ env.NOWEN_VERSION }}
          APP_VERSION: ${{ env.NOWEN_VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis

      - name: 严格校验 Windows RC 产物
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw "未生成 Windows NSIS 安装包" }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 10MB) { throw "NSIS 安装包尺寸异常: $($installer.FullName)" }
            Write-Host "[OK] $($installer.Name) $([math]::Round($installer.Length / 1MB, 2)) MB" -ForegroundColor Green
          }

      - name: 上传 Windows RC 安装包
        uses: actions/upload-artifact@v4
        with:
          name: nowen-video-desktop2-windows-rc
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建 Draft Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nowen-video-desktop2-windows-rc
          path: dist

      - name: 校验 Release 文件
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.exe' -print -quit)"
          ls -lah dist

      - name: 创建 GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.exe
