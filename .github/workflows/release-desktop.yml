# Nowen Video Desktop 2.0 — Windows & macOS release / RC build
#
# Trigger:
#  1. push tag v*.*.*   -> build Windows NSIS + macOS Apple Silicon DMG -> attach to Draft Release
#  2. workflow_dispatch -> build selected target RC artifact
name: release-desktop
run-name: >-
  release-desktop
  ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_name || '0.1.0' }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Product version, for example 2.0.0-rc.1'
        required: false
        default: '2.0.0-rc.1'
      target:
        description: 'Build target'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  fetch-assets:
    name: 准备 Windows Desktop 运行资源
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Desktop 运行资源
        uses: actions/cache@v4
        id: desktop-resource-cache
        with:
          path: desktop/src-tauri/resources
          key: desktop2-resources-v2-${{ hashFiles('scripts/fetch-assets.ps1') }}

      - name: 下载 libmpv / yt-dlp / 字幕字体
        if: steps.desktop-resource-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-assets.ps1 -Skip "shaders"

      - name: 严格校验 Desktop 运行资源
        shell: pwsh
        run: |
          $mpv = "desktop/src-tauri/resources/mpv/libmpv-2.dll"
          $ytdlp = "desktop/src-tauri/resources/yt-dlp.exe"
          $fonts = "desktop/src-tauri/resources/fonts"
          if (-not (Test-Path $mpv)) { throw "缺少 libmpv-2.dll" }
          if ((Get-Item $mpv).Length -lt 10MB) { throw "libmpv-2.dll 尺寸异常" }
          if (-not (Test-Path $ytdlp)) { throw "缺少 yt-dlp.exe" }
          if (-not (Test-Path $fonts)) { throw "缺少字幕字体目录" }
          if ((Get-ChildItem $fonts -File -Recurse | Measure-Object).Count -eq 0) { throw "字幕字体目录为空" }
          Write-Host "[OK] Desktop 运行资源完整" -ForegroundColor Green

      - name: 上传 Desktop 运行资源
        uses: actions/upload-artifact@v4
        with:
          name: desktop-resources
          path: desktop/src-tauri/resources
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: 构建 Windows x64 RC
    needs: fetch-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 下载 Desktop 运行资源
        uses: actions/download-artifact@v4
        with:
          name: desktop-resources
          path: desktop/src-tauri/resources

      - name: 校验 Desktop 2.0 架构契约
        shell: pwsh
        run: ./desktop/scripts/verify-desktop2-architecture.ps1

      - name: 解析并同步产品版本
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.version_name }}' }
          $version = $version -replace '^v',''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid product version: $version"
          }
          "NOWEN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          pwsh -ExecutionPolicy Bypass -File ./scripts/sync-version.ps1 -Version $version

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建正式 Go Media Core Sidecar
        shell: pwsh
        run: ./desktop/scripts/build-sidecar.ps1 -Production

      - name: 安装 Web 依赖
        working-directory: web
        run: npm ci

      - name: 构建 Web 产品界面
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.NOWEN_VERSION }}

      - name: 检查 Rust / Windows Render API
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: 构建 Windows NSIS 安装包
        working-directory: desktop/src-tauri
        env:
          NOWEN_VERSION: ${{ env.NOWEN_VERSION }}
          APP_VERSION: ${{ env.NOWEN_VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --config tauri.windows.conf.json --bundles nsis

      - name: 严格校验 Windows RC 产物
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw "未生成 Windows NSIS 安装包" }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 10MB) { throw "NSIS 安装包尺寸异常: $($installer.FullName)" }
            Write-Host "[OK] $($installer.Name) $([math]::Round($installer.Length / 1MB, 2)) MB" -ForegroundColor Green
          }

      - name: 上传 Windows RC 安装包
        uses: actions/upload-artifact@v4
        with:
          name: nowen-video-desktop2-windows-rc
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: 构建 macOS Apple Silicon DMG
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 安装 macOS 依赖 (mpv / dylibbundler)
        run: brew install mpv dylibbundler

      - name: 解析并同步产品版本
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version_name }}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid product version: $VERSION" >&2
            exit 1
          fi
          echo "NOWEN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          pwsh -ExecutionPolicy Bypass -File ./scripts/sync-version.ps1 -Version "$VERSION"

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建 macOS Go Media Core Sidecar
        env:
          NOWEN_VERSION: ${{ env.NOWEN_VERSION }}
        run: |
          mkdir -p desktop/src-tauri/bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/nowen-video/nowen-video/internal/version.Version=${NOWEN_VERSION}" \
            -o desktop/src-tauri/bin/nowen-video-server-aarch64-apple-darwin \
            ./cmd/server-lite
          cp desktop/src-tauri/bin/nowen-video-server-aarch64-apple-darwin desktop/src-tauri/bin/nowen-video-server

      - name: 安装 Web 依赖并构建界面
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ env.NOWEN_VERSION }}
        run: |
          npm ci
          npm run build

      - name: 检查 Rust / macOS 编译
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: 构建 macOS App 并打包 libmpv
        env:
          NOWEN_VERSION: ${{ env.NOWEN_VERSION }}
        run: |
          cd desktop/src-tauri
          tauri build --config tauri.macos.conf.json --bundles app
          APP_BUNDLE="target/release/bundle/macos/Nowen Video.app"
          test -d "$APP_BUNDLE"
          dylibbundler -od -b \
            -x "${APP_BUNDLE}/Contents/MacOS/nowen-video-desktop" \
            -d "${APP_BUNDLE}/Contents/Frameworks" \
            -p "@executable_path/../Frameworks" \
            -s /opt/homebrew/lib \
            -s /opt/homebrew/opt/mpv/lib
          codesign --force --deep --sign - "$APP_BUNDLE"
          mkdir -p target/release/bundle/dmg
          DMG_PATH="target/release/bundle/dmg/Nowen.Video_${NOWEN_VERSION}_aarch64.dmg"
          hdiutil create -volname "Nowen Video" -srcfolder "$APP_BUNDLE" -ov -format UDZO "$DMG_PATH"
          test -s "$DMG_PATH"
          ls -lh "$DMG_PATH"

      - name: 上传 macOS DMG 安装包
        uses: actions/upload-artifact@v4
        with:
          name: nowen-video-desktop2-macos-rc
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建或更新 Draft Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/') && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nowen-video-desktop2-windows-rc
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: nowen-video-desktop2-macos-rc
          path: dist

      - name: 校验 Desktop Release 文件并生成校验和
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          (cd dist && sha256sum ./*.exe ./*.dmg > SHA256SUMS-desktop.txt)
          ls -lah dist

      - name: 确保 Draft Release 已存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Nowen Video ${VERSION}" --notes "Automated release ${TAG}" || true
          fi

      - name: 上传 Desktop 安装包到 Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
