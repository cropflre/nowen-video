[package]
name = "nowen-video-desktop"
version = "1.2.5"
description = "Nowen Video Desktop 2.0（Tauri 2 + React + Go Media Core + libmpv）"
authors = ["nowen-video team"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
# build.rs 使用 cc 定位 Windows MSVC 工具链并生成 libmpv 导入库。
cc = "1.0"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
# 以下插件只由 Rust Runtime 内部使用，不向 WebView 暴露通用插件权限。
tauri-plugin-dialog = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-single-instance = { version = "2.0", features = ["deep-link"] }
tauri-plugin-global-shortcut = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

log = "0.4"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"

# Go Media Core 健康检查。
reqwest = { version = "0.12", features = ["json"] }

dirs = "5.0"
url = "2.5"

# Desktop 2.0 唯一正式播放器核心。
libmpv2 = { version = "4.1", optional = true }
# 事件泵使用独立 libmpv client handle，避免和主控制 handle 共用 event queue。
# libmpv2 4.x 本身也依赖同一套 4.x bindings，因此不会引入第二套 libmpv ABI。
libmpv2-sys = { version = "4.0", optional = true }
window-vibrancy = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["embed-mpv"]
custom-protocol = ["tauri/custom-protocol"]
embed-mpv = ["dep:libmpv2", "dep:libmpv2-sys"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
