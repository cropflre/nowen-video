services:
  nowen-video:
    image: {{DOCKERHUB_REPO}}:{{IMAGE_TAG}}
    container_name: nowen-video
    restart: unless-stopped
    user: "0:0"
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - "/var/apps/nowen-video/shares/nowen-video/data:/data"
      - "/var/apps/nowen-video/shares/nowen-video/cache:/cache"
      - "/var/apps/nowen-video/shares/nowen-video/media:/media"
    environment:
      - NOWEN_APP_PORT=8080
      - NOWEN_APP_DATA_DIR=/data
      - NOWEN_APP_WEB_DIR=/app/web/dist
      - NOWEN_DATABASE_DB_PATH=/data/nowen.db
      - NOWEN_CACHE_CACHE_DIR=/cache
      - NOWEN_LOGGING_LEVEL=info
      - PUID=0
      - PGID=0
      - UMASK=000
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
